<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Linea — Design Studio</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"><style>
:root{--bg:#e9e9e7;--ink:#0b0b0b;--mu:#8a8a86;--ln:rgba(11,11,11,.12);--pn:#fff;--dk:#0b0b0b;--r:30px;--mo:"JetBrains Mono",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,Arial,sans-serif;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}:focus-visible{outline:2px solid #4d6283;outline-offset:2px}.ic{display:block;flex:none}
@media(pointer:fine){html,body,a,button,input{cursor:none}}
#cd,#cr{position:fixed;left:0;top:0;z-index:999;pointer-events:none;display:none;mix-blend-mode:difference;background:#fff}
@media(pointer:fine){#cd,#cr{display:block}}
#cd{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
#cr{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:none;border:1px solid #fff;transition:width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1),margin .5s cubic-bezier(.2,.8,.2,1),border-radius .5s,background .4s}
#cr.h{width:76px;height:76px;margin:-38px 0 0 -38px;background:#fff}#cr.l{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:5px}#cr.d{scale:.82}
#app{position:fixed;inset:0;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.pg,#sel,#lw{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn{position:relative;border-radius:var(--r);overflow:hidden;background:var(--pn);min-height:0}.pn.k{background:var(--dk);color:#fff}
.art{position:absolute;inset:0;width:100%;height:100%}
.nv{position:absolute;left:22px;top:20px;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nv a{font-size:12px;padding:6px 12px;border-radius:99px;opacity:.65;transition:all .3s}.nv a:hover,.nv a.on{opacity:1;background:rgba(127,127,127,.18)}.nv .wm{font-weight:800;font-size:17px;letter-spacing:-.05em;opacity:1;padding:4px 14px 4px 0}.nv .wm:hover{background:none}
.pn.k .nv a,.pn.art-p .nv a{color:#fff}.pn.art-p .nv a.on,.pn.art-p .nv a:hover{background:rgba(255,255,255,.2)}
.tr{position:absolute;right:20px;top:18px;z-index:3;display:flex;align-items:center;gap:12px}.mo{font:400 10px var(--mo);letter-spacing:.08em;text-transform:uppercase}.lg{border:1px solid var(--ln);border-radius:99px;padding:6px 11px;transition:all .3s}.lg:hover{background:var(--dk);color:#fff}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--dk);color:#fff;border-radius:99px;padding:5px 5px 5px 20px;font-size:13px;font-weight:500;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.pill:hover{transform:translateX(4px)}.pill b{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.hb{position:absolute;left:24px;right:24px;bottom:22px;z-index:2}
h1,h2{font-weight:800;letter-spacing:-.055em;line-height:.98}h1{font-size:clamp(34px,4.4vw,70px)}h2{font-size:clamp(40px,6vw,104px)}.g{color:var(--mu)}
.bx{background:#fff;color:#0b0b0b;display:inline-block;padding:18px 22px 20px;border-radius:22px;max-width:min(560px,100%)}.bx h1 .g{color:#9a9a96}.bx .pill{margin-top:18px}.bx small{display:block;font:400 10px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:#6b6b68;margin-bottom:8px}
.sc{position:absolute;inset:0;overflow-y:auto;padding:84px 24px 28px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.lead{color:var(--mu);font-size:14px;max-width:26em;margin-top:14px}.pn.k .lead{color:#9d9d98}
.sr{border-top:1px solid var(--ln);padding:20px 0 24px;display:grid;grid-template-columns:44px 1fr;gap:6px 10px;transition:padding .6s cubic-bezier(.2,.8,.2,1)}.sr:hover{padding-left:12px}.sr .mo{color:var(--mu);padding-top:8px}.sr h3{font-size:clamp(22px,2.4vw,34px);font-weight:700;letter-spacing:-.045em}.sr p{grid-column:2;color:var(--mu);font-size:14px}.sr .ls{grid-column:2}
.ls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ls b{font:400 10px var(--mo);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--ln);padding:3px 10px;border-radius:99px;font-weight:400}
.st{position:absolute;z-index:2;font-size:12px;color:#9d9d98;text-align:right;right:24px}.st b{display:block;font-size:30px;font-weight:700;color:#fff;letter-spacing:-.05em;line-height:1}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.fb button{padding:6px 14px;border:1px solid var(--ln);border-radius:99px;font-size:12px;transition:all .3s}.fb button.on,.fb button:hover{background:var(--dk);color:#fff;border-color:var(--dk)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wk{display:block}.wk .cv{aspect-ratio:3/4;border-radius:22px;position:relative;overflow:hidden;transition:border-radius .8s cubic-bezier(.2,.8,.2,1)}.wk:hover .cv{border-radius:22px 22px 80px 22px}
.cv:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.14) calc(25% - 1px) 25%)}
.v0{background:linear-gradient(160deg,#4d6283,#c9d3e0)}.v1{background:linear-gradient(160deg,#1b241c,#6b7d63)}.v2{background:linear-gradient(160deg,#0b0b0b,#585855)}.v3{background:linear-gradient(160deg,#8a7f6e,#eae6dc)}
.wk h3{font-size:17px;font-weight:700;margin-top:10px}.wk p{font-size:12px;color:var(--mu)}
.tmr{display:grid;grid-template-columns:44px 1fr 24px;gap:4px 10px;padding:20px 0;border-top:1px solid var(--ln);transition:padding .6s cubic-bezier(.2,.8,.2,1)}.tmr:hover{padding-left:12px}.tmr h3{font-size:clamp(20px,2.2vw,30px);font-weight:700;letter-spacing:-.045em}.tmr p{grid-column:2;color:var(--mu);font-size:14px}.tmr .mo{color:var(--mu);padding-top:7px}.tmr .ic{margin-top:8px}
.sl{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-top:1px solid var(--ln);font-size:clamp(20px,2.4vw,32px);font-weight:700;letter-spacing:-.045em;transition:padding .6s cubic-bezier(.2,.8,.2,1)}.sl:hover{padding-left:12px}.sl.s{font-size:clamp(17px,1.8vw,22px);padding:14px 0}
.bk{display:inline-flex;align-items:center;gap:8px;font:400 11px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:22px}
.sec{border-top:1px solid var(--ln);padding:20px 0 24px}.sec h4{font:400 10px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}.sec p{font-size:16px;line-height:1.5}.sec .ls b{font-size:11px}
.qt{font-size:clamp(20px,2.2vw,30px);font-weight:700;letter-spacing:-.04em;line-height:1.15}.qt+small{display:block;margin-top:12px;color:var(--mu);font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 .cv{aspect-ratio:1;border-radius:16px;position:relative;overflow:hidden}
.ph{position:absolute;left:50%;top:46%;translate:-50% -50%;width:min(56%,340px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;background:linear-gradient(160deg,#4d6283,#c9d3e0);display:grid;place-items:center;color:#fff;font-size:60px;font-weight:800;letter-spacing:-.05em}.ph .mo{position:absolute;bottom:16px;font-size:10px;opacity:.8}
.pf>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.a{animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 450ms)}@keyframes rise{from{opacity:0;transform:translateY(26px)}}
#tc{position:fixed;inset:0;z-index:96;pointer-events:none;width:100%;height:100%}
#ld{position:fixed;inset:0;z-index:95;padding:10px;background:var(--bg)}
#sel .lp,#lw .pn{height:100%}.lp{display:flex;flex-direction:column;justify-content:space-between;padding:24px}.lp .top{display:flex;justify-content:space-between;align-items:center}.lp .wmk{font-weight:800;font-size:17px;letter-spacing:-.05em}.lp .mo{color:var(--mu)}
.lp .big{font-size:clamp(52px,8.4vw,140px);font-weight:800;letter-spacing:-.07em;line-height:.92;margin:0 0 28px}.lp .big .g{color:var(--mu)}
.lo{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px 0;border-top:1px solid var(--ln);text-align:left;transition:padding .6s cubic-bezier(.2,.8,.2,1)}.lo:last-child{border-bottom:1px solid var(--ln)}.lo:hover{padding-left:14px}
.lo span{font-size:clamp(28px,3.8vw,58px);font-weight:800;letter-spacing:-.055em;line-height:1}.lo small{display:block;font:400 10px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.lo b{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--pn);display:grid;place-items:center;flex:none;transition:transform .6s cubic-bezier(.2,.8,.2,1)}.lo:hover b{transform:rotate(-45deg) scale(1.1)}
#lt{position:absolute;left:24px;top:22px;color:#9d9d98}.cnt{position:absolute;left:24px;bottom:30px;font-size:clamp(90px,16vw,260px);font-weight:300;letter-spacing:-.08em;line-height:.8;font-variant-numeric:tabular-nums;color:#fff}.cnt i{font-style:normal;font-size:.2em;vertical-align:top;margin-left:.08em}
.lbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}#fl{height:100%;width:0;background:#fff}
#ch{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:12px}#ch.on{display:grid}
.cp{width:min(460px,100%);height:min(660px,calc(100dvh - 24px));display:flex;flex-direction:column;background:var(--pn);border-radius:var(--r);overflow:hidden;animation:sh .7s cubic-bezier(.2,.8,.2,1)}@keyframes sh{from{opacity:0;transform:translateY(24px)}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--ln);font-weight:700}.ch button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:background .3s}.ch button:hover{background:rgba(127,127,127,.2)}
#ms{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.m{max-width:84%;padding:10px 15px;font-size:14px;line-height:1.45;border-radius:20px;animation:pop .6s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.m.b{background:rgba(127,127,127,.14);align-self:flex-start;border-bottom-left-radius:6px}.m.u{background:var(--dk);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
#qr{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}#qr button{border:1px solid var(--ink);padding:8px 16px;border-radius:99px;font-size:13px;transition:all .3s}#qr button:hover{background:var(--ink);color:var(--pn)}
.in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln)}.in input{flex:1;min-width:0;background:rgba(127,127,127,.12);color:var(--ink);border:0;border-radius:99px;padding:12px 18px;font:inherit;font-size:14px;outline:0}.in button{width:44px;height:44px;border-radius:50%;background:var(--dk);color:#fff;display:grid;place-items:center}
@media(max-width:860px){.pg,#sel,#lw{grid-template-columns:1fr;grid-template-rows:40% 1fr}.nv a:not(.wm){display:none}.nv a.on{display:block}.hb{bottom:14px}.st{display:none}.sc{padding-top:24px}.tr .mo.ck{display:none}.tr{top:14px}.lp{padding:18px}.lp .big{font-size:clamp(40px,12vw,76px);margin-bottom:14px}.lo{padding:14px 0}.cnt{font-size:34vw}.ph{font-size:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v6 ===== */
#cd{width:10px;height:10px;margin:-5px 0 0 -5px;transition:opacity .3s}#cd.h{opacity:0}
#cr{width:34px;height:34px;margin:-17px 0 0 -17px;border:0;background:#fff;opacity:.3;border-radius:50%;transition:width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),margin .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
#cr.h{width:88px;height:88px;margin:-44px 0 0 -44px;opacity:1;border-radius:50%}#cr.l{width:52px;height:52px;margin:-26px 0 0 -26px;opacity:.55;border-radius:50%}#cr.d{scale:.82}
#ld{padding:10px}#ld.bk{padding:0;background:#000}
#sel{display:flex;flex-direction:column;justify-content:space-between;grid-template-columns:none;gap:0;background:var(--pn);border-radius:var(--r);padding:clamp(20px,3vw,40px);overflow:hidden}
#sel .top{display:flex;justify-content:space-between;align-items:center}#sel .wmk{font-weight:800;font-size:17px;letter-spacing:-.05em}#sel .mo{color:var(--mu)}
#sel .mid{display:flex;flex-direction:column;gap:clamp(0px,1vw,10px)}
.lg2{display:flex;align-items:center;gap:clamp(12px,2vw,28px);text-align:left;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
.lg2 small{font:400 11px var(--mo);color:var(--mu);width:2.4em;align-self:flex-start;margin-top:1.6em}
.lg2 span{font-size:clamp(56px,13vw,210px);font-weight:800;letter-spacing:-.07em;line-height:.95}
.lg2 b{width:clamp(44px,5vw,72px);height:clamp(44px,5vw,72px);border-radius:50%;background:var(--ink);color:var(--pn);display:grid;place-items:center;opacity:0;transform:translateX(-16px) scale(.7);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.lg2:hover b{opacity:1;transform:none}.lg2:hover{transform:translateX(12px)}.mid:hover .lg2:not(:hover){opacity:.22}
#lw{position:fixed;inset:0;z-index:3;background:#000;color:#fff;display:grid;place-items:center;grid-template-columns:none;gap:0}
#lw .cnt{position:static;font-size:clamp(110px,26vw,400px);font-weight:200;letter-spacing:-.07em;line-height:1;font-variant-numeric:tabular-nums}#lw .cnt i{font-size:.18em;vertical-align:top;margin-left:.06em;opacity:.6}
#ms{padding:18px;gap:10px}
.m{max-width:86%;padding:11px 16px;border-radius:20px;animation:msg .8s cubic-bezier(.2,.8,.2,1) both;white-space:pre-line}
@keyframes msg{from{opacity:0;transform:translateY(18px) scale(.95);filter:blur(8px)}}
.dt{display:inline-flex;gap:4px;padding:5px 0}.dt i{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:db 1s infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}@keyframes db{50%{transform:translateY(-4px);opacity:.4}}
.chip{display:inline-block;border:1px solid var(--ink);border-radius:99px;padding:9px 18px;font-size:13px;color:var(--ink);animation:chip .7s cubic-bezier(.2,.8,.2,1) both;transition:background .3s,color .3s}.chip:hover{background:var(--ink);color:var(--pn)}.chip.go{background:var(--ink);color:var(--pn)}@keyframes chip{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.m.card{width:94%;max-width:94%;white-space:normal}
.cm{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;text-transform:capitalize}.cm button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:background .3s}.cm button:hover{background:rgba(127,127,127,.2)}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cw{font:400 10px var(--mo);color:var(--mu);margin-bottom:6px;text-transform:uppercase}.cg button,.cg i{aspect-ratio:1}.cg button{border-radius:50%;font-size:13px;transition:all .3s}.cg button:hover:not(:disabled){background:var(--ink);color:var(--pn)}.cg button:disabled{opacity:.25}.cg .td{outline:1px dashed var(--mu)}.cg .sel{background:var(--ink);color:var(--pn)}
.pcard small{font:400 10px var(--mo);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}.pcard .pr{font-size:56px;font-weight:800;letter-spacing:-.06em;line-height:1;margin:6px 0 10px}.pcard .rw{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--ln);font-size:13px}.pcard .nt{font-size:12px;color:var(--mu);margin-top:6px}
.promo{font:500 22px var(--mo);letter-spacing:.12em;text-align:center;border:1px dashed var(--mu);border-radius:14px;padding:14px;margin-top:8px}
.pa{width:40px;height:44px;display:grid;place-items:center}.in{align-items:center}
#cd{width:8px;height:8px;margin:-4px 0 0 -4px}#cr{width:24px;height:24px;margin:-12px 0 0 -12px}#cr.h{width:42px;height:42px;margin:-21px 0 0 -21px;opacity:.85}#cr.l{width:32px;height:32px;margin:-16px 0 0 -16px}
.m.cal{width:min(290px,94%);max-width:290px;padding:12px 14px}.m.cal .cm{margin-bottom:6px;font-size:13px}.m.cal .cm button{width:26px;height:26px}.m.cal .cw{font-size:9px;margin-bottom:4px}.m.cal .cg{gap:2px}.m.cal .cg button{font-size:12px}
#ms{scroll-behavior:auto;scrollbar-width:thin;overscroll-behavior:contain}

/* ===== v7 ===== */
/* меню читаемо поверх сцен */
.pn.art-p .nv{left:16px;top:16px;gap:2px;padding:5px 8px;border-radius:99px;background:rgba(11,11,11,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pn.art-p .nv a{opacity:.85}.pn.art-p .nv .wm{padding:4px 12px 4px 10px}.pn.art-p .nv a.on,.pn.art-p .nv a:hover{opacity:1;background:rgba(255,255,255,.2)}
/* выбор языка — две карточки, без лишних текстов */
#sel{flex-direction:row;background:none;padding:0;gap:10px;border-radius:0;overflow:visible}
.lg3{flex:1;position:relative;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:clamp(20px,3vw,40px);text-align:left;transition:flex .9s cubic-bezier(.16,1,.3,1)}
.lg3[data-l=ru]{background:var(--dk);color:#fff}.lg3[data-l=en]{background:var(--pn);color:var(--ink)}
.lg3:hover{flex:1.7}
.lg3 .c{font-size:clamp(90px,22vw,380px);font-weight:800;letter-spacing:-.08em;line-height:.8;transition:transform .9s cubic-bezier(.16,1,.3,1)}.lg3:hover .c{transform:translateX(10px)}
.lg3 .n{font:400 12px var(--mo);letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:22px}

.lg3[data-l=ru] b{background:#fff;color:#000}.lg3[data-l=en] b{background:var(--ink);color:var(--pn)}.lg3:hover b{opacity:1;transform:none}
@media(max-width:860px){#sel{flex-direction:column}.lg3 .c{font-size:36vw}.lg3:hover{flex:1.35}}
/* загрузка: проценты слева снизу, средний размер */
#lw{place-items:end start;padding:clamp(24px,3vw,44px)}
#lw .cnt{font-size:clamp(56px,8vw,112px);font-weight:300;letter-spacing:-.06em}#lw .cnt i{font-size:.26em;margin-left:.1em;opacity:.55}
/* чат */
.cp{border-radius:34px;box-shadow:0 40px 100px -20px rgba(0,0,0,.45);animation:cin 1s cubic-bezier(.16,1,.3,1)}
@keyframes cin{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(10px)}}
.ch{justify-content:flex-start;gap:10px;border-bottom:0;padding:18px 20px 12px}.ch span{flex:1}
.orb{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ff5b3a,#e8a33d,#8da0bd,#4d6283,#ff5b3a);animation:orb 6s linear infinite;position:relative;flex:none}.orb:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--pn)}
@keyframes orb{to{rotate:360deg}}
#pbar{height:2px;background:var(--ln);margin:0 20px 2px;border-radius:2px;overflow:hidden}#pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 1.1s cubic-bezier(.16,1,.3,1)}
#ms{padding:16px 20px;gap:12px;background:radial-gradient(70% 40% at 50% 0,rgba(127,127,127,.1),transparent 70%)}

CS:[['Серия из 8 динамичных рилс для бренда одежды к запуску новой коллекции.','Собрали раскадровку под ритм трека, снимали на телефон со стабилизатором, смонтировали на битах, сделали переходы по движению и единый цветокор.','Материал снимали при разном свете: выровняли цвет в одну палитру и уложили все ролики в 9:16 с безопасными зонами под интерфейс.','Ролики зашли с первого раза: охваты выросли в разы, а команда уложилась в сроки.','Основательница бренда одежды'],['Логотип, палитра и носители для небольшой кофейни.','Изучили район и аудиторию, сделали три концепции, выбрали знак из одной линии и собрали гайд, макеты стаканов, меню и вывески.','Знак должен читаться и на крошечной наклейке, и на фасаде: упростили форму и подобрали плотные контрастные цвета.','Теперь кофейню узнают по стакану на улице. Работать было легко и быстро.','Владелец кофейни'],['Лендинг для стартапа с анимациями и формой заявки.','Сделали прототип на сетке, собрали на чистом коде без тяжёлых библиотек, добавили анимации по скроллу и отправку заявок в Telegram.','Нужно было удержать скорость загрузки при обилии анимаций: оптимизировали ресурсы и анимировали только transform и opacity.','Лендинг загружается мгновенно, заявки приходят сразу в мессенджер. Именно то, что нужно.','Сооснователь стартапа'],['Контент-план и ведение Instagram для локального бренда.','Разобрали аудиторию, придумали рубрики, шаблоны сторис и единый визуал, наладили публикации по расписанию и еженедельную аналитику.','У бренда не было своего фото-контента: собрали банк съёмок и ввели шаблоны, чтобы держать стиль без больших затрат.','Профиль наконец выглядит цельно, а заявки из Instagram стали приходить регулярно.','Менеджер локального бренда'],['Промо-ролик автомобиля: моушн, звук и титры.','Сняли динамику на ходу, добавили моушн-графику с линиями траектории, собрали звук из синтеза и шума ветра, подогнали титры под ритм.','Блики на кузове мешали цветокору: работали масками и выравнивали отражения отдельно; звук синхронизировали покадрово.','Ролик выглядит как работа крупного агентства. Показываем его на каждой встрече.','Менеджер автосалона'],['Серия постеров для фестиваля в едином стиле.','Вывели систему из сетки и одного шрифта, сделали модульные композиции и подготовили версии для печати и для соцсетей.','Серия должна работать и вместе, и по отдельности: выстроили общую сетку и ограничили палитру двумя цветами.','Постеры подхватили и в городе, и в сети: афиша стала узнаваемой.','Организатор фестиваля']],
R:[['Motion-дизайнер','Ритм, динамика и цветокор.','Собирает ролики с чувством ритма: от рилс до промо. Работает с цветом, звуком и динамикой, чтобы кадр цеплял с первой секунды.',['Монтаж','Цветокор','Моушн','Звук']],['Графический дизайнер','Айдентика и графика с характером.','Рисует айдентику, логотипы и графику с характером. Любит сильную типографику и чистую композицию.',['Айдентика','Логотипы','Постеры','Типографика']],['Разработчик','Сайты, боты и приложения.','Превращает идеи в рабочие сайты, боты и приложения: быстро, аккуратно, с вниманием к деталям и анимации.',['Сайты','Боты','Приложения','Автоматизация']],['SMM-менеджер','Контент, который растит аудиторию.','Строит контент-планы и визуал для соцсетей, ведёт аккаунты и помогает брендам находить свою аудиторию.',['Контент-план','Визуал','Ведение','Аналитика']]]},

['Payment','We work with a prepayment: its size (25% by default) and the total price are fixed in the brief before work starts. The remainder is paid after you approve the result and before the final files are handed over. Payment details come after the brief, and the payment status is visible on the Orders page.'],
['Deadlines','We name the deadline in the brief and count it from the prepayment and from receiving all the materials we need. If materials arrive late or you need revisions beyond what was agreed, the deadline moves — and we tell you in advance. Rush orders are possible by arrangement.'],
['If you stop responding','If we get no reply or materials for more than 7 days, the order is paused and the deadline moves. After 30 days of silence the order is closed: the completed work stays with the studio and the prepayment is not returned, because the time was already reserved for your project. You can come back any time — just message us.'],
['Refunds','Before work starts, the prepayment is refunded in full. After it starts, it is refunded minus the work already done and shown to you. If the result fundamentally differs from the agreed brief and revisions did not help, we refund the unfinished part. Send refund requests on Telegram or by email — we reply within a few business days.'],
['Data and privacy','We do not publish or share your data, materials or order details with third parties. Work appears in our case studies only with your consent, and your contacts are used only to communicate about the order.'],
['Non-disclosure','At the client’s request we sign an NDA before work begins: the project is not shown in the portfolio or on social media, and all details stay between us. Just mention it in the brief or in your first message.'],
['Working with AI','For us AI is a helper, not the main tool. Ideas, concepts, decisions and the final assembly are the work of the studio’s designers and developers. AI helps with routine, drafts and speed, and everything is checked and refined by hand. If you do not want AI in your project, let us know — we will respect that.'],
['About the studio','Linea is a small design and development studio: motion, graphics, SMM and marketing, websites, bots and mini apps. We work directly with the client, with no middlemen.'],
['Contests and merch','Coming soon: contests for followers and branded studio merch. Follow us on social media — we announce there first.'],

CS:[['A series of 8 dynamic reels for a clothing brand’s new collection launch.','We built a storyboard to the track’s rhythm, shot on a phone with a stabilizer, cut on the beat, added motion-based transitions and one unified color grade.','Footage was shot in mixed light: we matched it into one palette and fitted every reel to 9:16 with safe zones for the interface.','The reels worked on the first try: reach grew several times over, and the team hit every deadline.','Founder of a clothing brand'],['Logo, palette and branded materials for a small coffee shop.','We studied the neighborhood and audience, made three concepts, picked a single-line mark and built a guide, cup mockups, menu and signage.','The mark had to read on a tiny sticker and on a storefront: we simplified the shape and chose dense, high-contrast colors.','People now recognize the café by the cup on the street. Working together was easy and fast.','Coffee shop owner'],['A startup landing page with animations and a lead form.','We prototyped on a grid, built in clean code without heavy libraries, added scroll animations and sent leads straight to Telegram.','We had to keep load speed high despite many animations: we optimized assets and animated only transform and opacity.','The landing page loads instantly and leads arrive right in the messenger. Exactly what we needed.','Startup co-founder'],['Content plan and Instagram management for a local brand.','We analyzed the audience, created content series, story templates and one visual style, set up scheduled posting and weekly analytics.','The brand had no photo content of its own: we built a shoot bank and templates to keep the style on a small budget.','The profile finally looks cohesive, and leads from Instagram now arrive regularly.','Local brand manager'],['A car promo video: motion, sound and titles.','We shot the dynamics on the move, added motion graphics with trajectory lines, built sound from synth and wind noise and timed the titles to the rhythm.','Reflections on the body made grading hard: we worked with masks and balanced reflections separately; sound was synced frame by frame.','The video looks like a big agency’s work. We show it at every meeting.','Car dealership manager'],['A festival poster series in a unified style.','We built a system from one grid and one typeface, made modular compositions and prepared print and social versions.','The series had to work both together and alone: we set a shared grid and limited the palette to two colors.','The posters were picked up both in the city and online: the festival look became recognizable.','Festival organizer']],

 add(b,t){A.ed={t,i:-1,isNew:1};A.sec='a';A.w=blank[t]();swap()},
 edit(b,t,i){A.ed={t,i:t=='order'?i:+i,id:i};A.w=clone(t=='case'?DATA.cases[+i]:t=='team'?DATA.team[+i]:t=='service'?DATA.services[+i]:ST().find(o=>o.id==i));A.sec='a';swap()},
 see(b,t,i){viewSite(L||'ru',t=='case'?'#/works/'+i:'#/team/'+i)},
 view(b,l){viewSite(l,'#/')},
 mv(b,t,i,d){i=+i;const a=t=='case'?DATA.cases:DATA.team,j=i+ +d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(t=='team')DATA.cases.forEach(c=>{if(c.by===i)c.by=j;else if(c.by===j)c.by=i});commit();draw(1)},
 dup(b,t,i){const c=clone(DATA.cases[+i]);c.name+=' (копия)';DATA.cases.splice(+i+1,0,c);commit();draw(1)},
 del(b,t,i){sure(b,()=>{if(t=='order')SV(ST().filter(o=>o.id!=i));else{const n=+i;if(t=='case')DATA.cases.splice(n,1);else{DATA.team.splice(n,1);DATA.cases.forEach(c=>{if(c.by===n)c.by=null;else if(c.by>n)c.by--})}commit()}draw(1)})},
 rmimg(b,i){if(A.ed.t=='case')A.w.img.splice(+i,1);else A.w.photo='';rth()},
 addurl(){const e=adm.querySelector('[data-f="_url"]'),v=e.value.trim();if(!/^(https?:|data:image)/i.test(v))return toast('Нужна ссылка вида https://…');if(A.ed.t=='case'){if(A.w.img.length>=3)return toast('Максимум 3 фото');A.w.img.push(v)}else A.w.photo=v;e.value='';rth()},
 addrow(){document.getElementById('prows').insertAdjacentHTML('beforeend',prow('',10))},

 rmrev(){const a=ST(),o=a.find(q=>q.id==A.ed.id);if(o){delete o.rv;SV(a)}A.w=clone(o);draw(1)},
 gate(){const v=rd();if(isLogin(v.lg||'')&&isPass(v.pw||''))login();else toast('Неверный логин или пароль')},
 out(){AUTH=false;try{sessionStorage.removeItem('lx_auth')}catch(e){}viewSite(L||'ru','#/')},
 bake,
 expjson(){dl('linea-data.json',JSON.stringify(DATA,null,1),'application/json')},
 discard(b){sure(b,()=>{const pw=DATA.pw;try{localStorage.removeItem('lx_site')}catch(e){}DATA=load();if(pw)DATA.pw=pw;applyData(DATA);draw(1);toast('Правки отменены')})},
 reset(b){sure(b,()=>{const pw=DATA.pw;DATA=clone(D0);DATA.pw=pw;commit();draw(1);toast('Сброшено к исходным')})},
 save(b,t){const v=rd(),n=s=>+s||0;
  if(t=='case'){if(!v.name.trim())return toast('Введите название кейса');
   const o={cat:n(v.cat),name:v.name.trim(),yr:n(v.yr)||new Date().getFullYear(),v:n(v.v),by:v.by===''?null:n(v.by),img:A.w.img};LG.forEach(l=>o[l]={t:v[l+'_t'],a:v[l+'_a'],b:v[l+'_b'],c:v[l+'_c'],q:v[l+'_q'],w:v[l+'_w']});
   if(A.ed.isNew)DATA.cases.push(o);else DATA.cases[A.ed.i]=o}
  else if(t=='team'){if(!v.ru_role.trim()&&!v.en_role.trim())return toast('Укажите должность');
   const o={photo:A.w.photo,links:pl(v.links)};LG.forEach(l=>o[l]={role:v[l+'_role'],tag:v[l+'_tag'],bio:v[l+'_bio'],sk:v[l+'_sk']});
   if(A.ed.isNew)DATA.team.push(o);else DATA.team[A.ed.i]=o}
  else if(t=='service'){const o={pr:[n(v.lo),n(v.hi)]};LG.forEach(l=>o[l]=[v[l+'_n'],v[l+'_d'],v[l+'_t']]);DATA.services[A.ed.i]=o}
  else if(t=='order'){const a=ST();let o;if(A.ed.isNew){o=A.w;a.unshift(o)}else o=a.find(q=>q.id==A.ed.id);if(!o)return;
   Object.assign(o,{cat:v.cat,need:v.need,name:v.name,net:v.net,contact:v.contact,price:n(v.price),paid:n(v.paid),pct:n(v.pct)});
   if(v.dl&&v.dl!==iso(o.dl)){o.dl=new Date(v.dl+'T12:00:00').getTime();o.date=fmt(new Date(o.dl));o.days=Math.max(0,Math.round((o.dl-o.ts)/864e5))}
   if(v.pg==='')delete o.pg;else o.pg=Math.max(0,Math.min(100,n(v.pg)));SV(a);A.ed=null;swap();return toast('Сохранено')}
  else if(t=='texts'){LG.forEach(l=>DATA.txt[l]={h:v[l+'_h'],cta:v[l+'_cta'],lead:v[l+'_lead'],ch:v[l+'_ch'],cb:v[l+'_cb'],cl:v[l+'_cl']})}
  else if(t=='contacts'){DATA.soc=pl(v.soc);DATA.ms=pl(v.ms)}
  else if(t=='promo'){const o={};adm.querySelectorAll('.prow').forEach(r=>{const k=r.querySelector('[data-pk]').value.trim().toUpperCase().replace(/\s+/g,''),p=+r.querySelector('[data-pv]').value;if(k&&p>0&&p<=100)o[k]=p});DATA.promo=o}
  else if(t=='settings'){DATA.tg={token:v.tg_token.trim(),chat:v.tg_chat.trim()};DATA.card=v.card.trim();DATA.banks=pl(v.banks)}
  commit();const list=['case','team','service'].includes(t);A.ed=null;list?swap():draw(1);toast('Сохранено')}
};

const secret=ph=>{const i=$('#i');i.oninput=null;i.type='password';i.disabled=false;i.placeholder=ph;i.value='';i.focus();return new Promise(r=>{sub=()=>{const v=i.value;if(!v)return;i.value='';i.type='text';i.disabled=true;sub=null;me('•'.repeat(Math.min(v.length,12)));r(v)}})};
async function adminLogin(s){const en=L=='en';
 await bot(en?'Enter the password.':'Введите пароль.',s);
 for(let k=0;k<3;k++){const v=await secret(en?'Password':'Пароль');
  if(ADM.isPass(v)){await bot(en?'Welcome to the admin panel.':'Добро пожаловать в админ-панель.',s);closeChat();ADM.enter();return}
  if(k<2)await bot(en?'Wrong password. Try again.':'Неверный пароль. Попробуйте ещё раз.',s)}
 await bot(en?'Too many attempts.':'Слишком много попыток.',s);closeChat()}
